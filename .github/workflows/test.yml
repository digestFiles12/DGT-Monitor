name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, release, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [develop, release, main]

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Lint with Pylance (syntax check)
        run: python -m compileall -q dgt_monitor dashboard
        continue-on-error: true
      
      - name: Run tests with pytest
        run: |
          export QT_QPA_PLATFORM=offscreen
          python -m pytest test -v --tb=short --durations=10
      
      - name: Check code formatting (whitespace)
        run: git diff --check
        continue-on-error: true
      
      - name: Test imports
        run: python -c "import dgt_monitor; import dashboard"

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    
    steps:
      - name: Trigger Render deployment
        run: |
          echo "Render will auto-deploy from render.yaml on push"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Health check: GET /api/health"
