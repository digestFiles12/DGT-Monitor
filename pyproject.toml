[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dgt-monitor"
version = "0.1.0"
description = "Modular monitor of DGT traffic incidents and cameras"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32.0",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
]
gui = [
  "PyQt6>=6.7.0",
]
dev = [
  "dgt-monitor[web,gui]",
  "pytest>=8.0.0",
  "httpx2>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dgt_monitor*"]

[tool.setuptools.package-data]
"dgt_monitor.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
