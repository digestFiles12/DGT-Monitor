services:
  - type: web
    name: dgt-monitor
    runtime: python
    plan: free
    buildCommand: pip install -e ".[dev]" && python -m pytest tests -q --tb=no && python -m compileall -q src
    startCommand: uvicorn dgt_monitor.web.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ACTIVITY_API_KEYS
        sync: false
      - key: ACTIVITY_REVOKED_API_KEYS
        sync: false
      - key: ACTIVITY_DB_PATH
        value: "/tmp/activity.db"  # Temporary storage per deployment
    healthCheckPath: /api/health
    autoDeploy: true
